# tasks file for setup-wayland
- name: ensure wayland packages are installed 
  loop:
    "{{ setup_wayland_pkgs }}"
  community.general.pkgng:
    name: "{{ item }}"
    state: present

- name: ensure driver packages are installed 
  community.general.pkgng:
    name: "{{ setup_wayland_driver_pkg }}"
    state: present
